name: Release

# `pnpm release <patch|minor|major>` commits the next version and tags it; pushing the tag lands here.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # Everything that runs code from dependencies happens here, without the right to publish.
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: what is published must not be built from a cache another workflow could write.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Check that the tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node --print 'require("./packages/ottersql/package.json").version')" = "$TAG"
      - run: pnpm build
      - run: pnpm --filter ottersql pack --pack-destination "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
          if-no-files-found: error

  # Only this job can publish, and it runs nothing but pnpm on the tarball built above.
  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # npm trusts this workflow in this environment to publish, with no token (trusted publishing).
    environment: npm
    permissions:
      contents: read
      id-token: write # proves to npm that this workflow publishes, in place of a token
    steps:
      # Only package.json, whose devEngines pin pnpm; nothing from the repository runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      # A tag checks out no branch, which git checks would refuse.
      - run: pnpm publish "$RUNNER_TEMP"/package/*.tgz --access public --no-git-checks

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes list the commits since the previous tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      # Installs the Node.js version devEngines pins, which runs the notes script's TypeScript, and
      # only the notes script's package, which has no dependencies.
      - run: pnpm install --frozen-lockfile --filter @ottersql/release
      - name: Publish the release notes
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pnpm --silent exec node packages/release/src/cli.ts notes "$TAG" "$REPOSITORY" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
