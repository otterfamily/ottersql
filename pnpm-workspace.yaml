packages:
  - packages/*
  - examples/*

catalog:
  "@electric-sql/pglite": ^0.5.11
  "@electric-sql/pglite-pgvector": ^0.0.12
  "@ottersql/catalog": workspace:*
  "@ottersql/content-mapper": workspace:*
  "@ottersql/migrate": workspace:*
  "@ottersql/sql": workspace:*
  "@ottersql/testing": workspace:*
  "@testcontainers/postgresql": ^12.2.1
  "@types/node": ^26.6.5
  "@types/pg": ^8.23.1
  esbuild: ^0.28.2
  eslint-plugin-regexp: ^3.3.1
  jsonc-parser: ^3.3.1
  knip: ^6.42.1
  next: ^16.4.3
  ottersql: workspace:*
  oxfmt: ^0.74.0
  oxlint: ^1.89.0
  oxlint-tsgolint: ^7.0.2005
  pg: ^8.23.1
  postgres: ^3.4.9
  react: ^19.3.1
  react-dom: ^19.3.1
  simple-git-hooks: ^2.14.0
  std-env: ^4.3.0
  typescript: 7.1.0-beta
  vite: ^8.3.5
  vitest: ^5.0.5
  vscode-jsonrpc: ^10.0.0
  webpack: ^5.112.2

catalogMode: strict

trustPolicy: no-downgrade

# Optional native speed-ups and version checks pulled in by testcontainers; nothing needs them.
allowBuilds:
  cpu-features: false
  protobufjs: false
  ssh2: false
  # esbuild's script only checks its binary, which the platform package already provides.
  esbuild: false
  # The workspace's own postinstall installs the git hooks.
  simple-git-hooks: false
