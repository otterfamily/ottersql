# A local Postgres for the example, on a port that leaves a default Postgres on 5432 alone.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ottersql
      POSTGRES_PASSWORD: ottersql
      POSTGRES_DB: example
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ottersql", "-d", "example"]
      interval: 1s
      retries: 30
